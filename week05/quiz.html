<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <h1>HTML and CSS Quiz</h1>
    <form>
        <fieldset>
            <div class="column hola">
                <label for="Question1">1.Which HTML attribute must match the 'id' attribute of an
                    input
                    element to correctly associate them
                    so that clicking the label focuses the input field?</label>
                <input type="text" id="Question1" Name="Question1">
            </div>
        </fieldset>


        <fieldset>
            <div class="column ele">
                <label for="Question2">2.Which of the following is the correct CSS syntax to apply
                    the
                    same
                    styling rules to both and
                    elements simultaneously?</label>
                <select name="Question2" id="Question2">
                    <option value="A">h + td { ... }.</option>
                    <option value="B">th > td { ... }.</option>
                    <option value="C">th td { ... }.</option>
                    <option value="D">th, td { ... }</option>
                </select>
            </div>
        </fieldset>

        <fieldset>
            <div class="column ele">
                <label for="Question3">3.Which CSS property should be adjusted to increase the space
                    between
                    the text inside an input field
                    and the input field's inner border?</label>
                <input type="textarea" id="Question3" name="Question3">
            </div>
        </fieldset>


        <fieldset>
            <div class="column ele">
                <label for="Question4">4.How many distinct vertical columns will elements be
                    arranged
                    into
                    within this grid container?
                    .container {
                    display: grid;
                    grid-template-columns: 1fr 2fr 1fr;
                    } (type the number)</label>
                <input type="int" id="Question4" name="Question4">
                <button type="submit">Submit Poll</button>
            </div>
        </fieldset>
    </form>


</body>

</html>
