<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us Rafting Compas</title>
    <meta name="description" content="This is the official Rafting Site page made by Joel Flores,
      with all the information that you need to contact us and rafting, the Adventure Awaits You!">
    <meta name="author" content="Joel Flores">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <div class="logo-box">
            <img src="images/raftingcompas.jpg" alt="some dudes rafting">
        </div>
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section1 class="flex1">
            <h1>Rafting-Compas Company</h1>
            <p>Jr. Sinchi Roca 2318, Lima, Perú</p>
            <p>Lima, Perú</p>
            <p>+51 987 654 321</p>
            <p>info@raftingcompas.com</p>
        </section1>

        <div class="hero">
            <div class="map-container">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3901.393043538089!2d-77.04752732670671!3d-12.085222742614366!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9105c8f81d8b8dfb%3A0x460314864f22eb91!2sJr.%20Sinchi%20Roca%202318%2C%20Lince%2015073!5e0!3m2!1ses-419!2spe!4v1780872522360!5m2!1ses-419!2spe"></iframe>
            </div>

            <form class="flexer">
                <div class="good1">
                    <label for="Name">Name</label>
                    <input type="text" id="Name" name="Name" placeholder="Placeholder">
                </div>

                <div class="good1">
                    <label for="Email">Email</label>
                    <input type="email" id="Email" name="Email" placeholder="Placeholder">
                </div>

                <div class="good2">
                    <span class="label-purpose">Message Purpose</span>
                    <div class="radio-group">
                        <div class="good3">
                            <input type="radio" id="general" name="purpose" value="general" checked>
                            <label for="general">General Inquiry</label>
                        </div>
                        <div class="good3">
                            <input type="radio" id="reservation" name="purpose" value="reservation">
                            <label for="reservation">Reservation Question</label>
                        </div>
                        <div class="good3">
                            <input type="radio" id="suggestion" name="purpose" value="suggestion">
                            <label for="suggestion">Website Suggestion</label>
                        </div>
                    </div>
                </div>

                <div class="message-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4"
                      placeholder="Type here"></textarea>
                </div>

                <div class="bad1">
                    <input type="checkbox" id="check" name="check" value="subscribe">
                    <label for="check">Please Subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit" class="submit-btn">Get in Touch!</button>
            </form>
        </div>

        <article class="backg">
            <h2>We Are Here to Serve You</h2>
            <section class="division">
                <figure>
                    <img src="images/employee1.jpg" alt="Employee Profile ">
                    <figcaption>Rafting Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="Employee Profile ">
                    <figcaption>Trip Leader</figcaption>
                </figure>

                <figure>
                    <img src="images/happy.jpg" alt="Employee Profile">
                    <figcaption>Reservations Coordinator</figcaption>
                </figure>
            </section>
        </article>
    </main>

    <footer>
        <p>© 2026 Rafting Compas | Joel Flores </p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.svg" alt="Facebook Icon"></a>
            <a href="https://linkedin.com"><img src="images/linkedin.svg" alt="LinkedIn Icon"></a>
            <a href="https://instagram.com"><img src="images/instagram.svg"
                  alt="Instagram Icon"></a>
        </nav>
    </footer>
</body>

</html>
